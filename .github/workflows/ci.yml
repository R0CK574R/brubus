# Every push: build the C++ core with three compilers on two processor families, run its unit tests, and check that
# each build computes the three maps' results bit for bit as the reference does (cpp/tests/golden.digest). Where
# Python is set up, also hold the Python planners against the C++ ones on that machine, with == and no tolerance.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86-64, GCC",        os: ubuntu-24.04,     cxx: g++,     python: tests }
          - { name: "Linux x86-64, Clang",      os: ubuntu-24.04,     cxx: clang++, python: parity }
          - { name: "Linux ARM64, GCC",         os: ubuntu-24.04-arm, cxx: g++,     python: parity }
          - { name: "macOS ARM64, Apple Clang", os: macos-latest,     cxx: clang++, python: parity }
          - { name: "Windows x86-64, MSVC",     os: windows-2022,     cxx: "",      python: none }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python packages
        if: matrix.python != 'none'
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 matplotlib==3.11.2 pandas==3.0.5 pytest==9.1.1 pybind11==3.1.0
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX="${{ matrix.cxx }}"; fi
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.python == 'none' && '-DROBOTNAV_PYTHON=OFF' || '' }}
      - name: Build
        run: cmake --build cpp/build --config Release --parallel
      - name: Unit tests, and every result bit for bit against the reference
        run: ctest --test-dir cpp/build -C Release --output-on-failure
      - name: Python planners against the C++ ones, on this machine
        if: matrix.python != 'none'
        run: python main.py parity
      - name: Python tests
        if: matrix.python == 'tests'
        run: python -m pytest -q

  sanitizers:
    name: Address and undefined-behaviour sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S cpp -B cpp/build -DROBOTNAV_PYTHON=OFF -DCMAKE_BUILD_TYPE=None -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build cpp/build --parallel
      - name: Unit tests and the reference results, under the sanitizers
        run: ctest --test-dir cpp/build --output-on-failure
